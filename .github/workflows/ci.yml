name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint, unit/integration tests, production build, then the build guard (lazy chunks + size budget)
      - run: npm run verify
      # an advisory against anything the game ships should fail the build (dev-tool advisories are handled in package.json overrides)
      - run: npm run audit:prod
